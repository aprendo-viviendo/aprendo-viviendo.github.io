<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Aprendo Viviendo: ideas y recursos para vivir con más bienestar.">
  <meta name="theme-color" content="#668541">
  <title>Aprendo Viviendo</title>
  <link rel="canonical" href="https://YOUR_DOMAIN.com/" />
  <style>
    :root {
      color-scheme: light;
      --green: #668541;
      --brown: #bb8f60;
      --ink: #30382a;
      --paper: #fbfaf7;
    }

    * { box-sizing: border-box; }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 32px 20px;
      place-items: center;
      background: var(--paper);
      color: var(--ink);
      font-family: system-ui, sans-serif;
      text-align: center;
    }

    main { max-width: 640px; }

    .hero-logo {
      display: block;
      width: 200px;
      height: 200px;
      margin: 0 auto 24px;
      object-fit: cover;
    }

    .brand {
      margin: 0 0 18px;
      color: var(--green);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, serif;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 500;
      line-height: 1.05;
    }

    .welcome {
      margin: 20px 0 30px;
      color: #62685b;
      font-size: 1.1rem;
      line-height: 1.6;
    }

    .cta {
      display: inline-block;
      padding: 14px 22px;
      border-radius: 4px;
      background: var(--green);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }

    .cta:hover, .cta:focus-visible { background: var(--brown); }
  </style>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-STF9F81YH5"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-STF9F81YH5');
  </script>
</head>
<body>
  <main>
    <img class="hero-logo" src="reinicio-3-dias/assets/logo.svg" width="200" height="200" alt="Aprendo Viviendo Logo" fetchpriority="high" loading="eager">
    <p class="brand">Aprendo Viviendo</p>
    <h1>Bienvenido a Aprendo Viviendo</h1>
    <p class="welcome">Un espacio para aprender, cuidarte y vivir mejor.</p>
    <a class="cta" href="/reinicio-3-dias/">Descarga El Reinicio de 3 Días</a>
  </main>
</body>
</html>
