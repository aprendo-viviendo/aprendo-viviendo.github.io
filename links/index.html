<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fefefe">
  <meta name="description" content="Sigue a Carlos Correa y descubre recursos sobre longevidad y fuerza en Aprendo Viviendo.">
  <title>Carlos Correa | Aprendo Viviendo</title>
  <style>
    :root {
      color-scheme: light;
      --background: #fefefe;
      --text: #323b1f;
      --green: #668541;
      --brown: #bb8f60;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 40px 20px 24px;
      place-items: center;
      background: var(--background);
      color: var(--text);
      font-family: system-ui, sans-serif;
      text-align: center;
    }

    .profile {
      width: min(100%, 520px);
      margin: auto;
    }

    .logo {
      display: block;
      width: 144px;
      height: 144px;
      margin: 0 auto 24px;
      border-radius: 50%;
      object-fit: cover;
    }

    h1 {
      margin: 0;
      font-family: Georgia, serif;
      font-size: clamp(2.5rem, 9vw, 3.5rem);
      font-weight: 500;
      line-height: 1.1;
    }

    .subtitle {
      margin: 12px 0 30px;
      font-size: 1rem;
      line-height: 1.5;
    }

    .links {
      display: grid;
      gap: 12px;
    }

    .link-button {
      display: block;
      width: 100%;
      padding: 15px 20px;
      border-radius: 4px;
      background: var(--green);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.4;
      text-decoration: none;
      transition: background-color 150ms ease;
    }

    .link-button:hover,
    .link-button:focus-visible {
      background: var(--brown);
    }

    .link-button:focus-visible {
      outline: 3px solid var(--text);
      outline-offset: 3px;
    }

    footer {
      margin-top: 40px;
      font-size: 0.875rem;
    }

    @media (max-width: 480px) {
      body {
        padding: 32px 18px 20px;
      }

      .logo {
        width: 128px;
        height: 128px;
      }
    }
  </style>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-STF9F81YH5"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-STF9F81YH5');
  </script>
</head>
<body>
  <main class="profile">
    <img class="logo" src="../reinicio-3-dias/assets/logo.jpg" width="144" height="144" alt="Aprendo Viviendo">
    <h1>Carlos Correa</h1>
    <p class="subtitle">Reset 40+ | Longevidad y Fuerza</p>

    <nav class="links" aria-label="Enlaces de Carlos Correa">
      <a class="link-button" href="https://aprendoviviendo.com/downloads/guia-reinicio-3dias.pdf">Descargar Guía Gratis</a>
      <a class="link-button" href="https://www.skool.com/aprendo-viviendo-comunidad-7021/about">Unirme a la Comunidad Skool</a>
      <a class="link-button" href="https://www.instagram.com/aprendo_viviendo777">Sígueme en Instagram</a>
      <a class="link-button" href="https://www.tiktok.com/@aprendoviviendo">Sígueme en TikTok</a>
      <a class="link-button" href="https://www.youtube.com/@AprendoViviendo">Ver en YouTube</a>
      <a class="link-button" href="https://www.facebook.com/AprendoViviendoFB">Sígueme en Facebook</a>
    </nav>

    <footer>© 2026 Aprendo Viviendo</footer>
  </main>
</body>
</html>
